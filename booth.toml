# About:Face booth configuration.
#
# `cargo run -p afbooth` reads this file from the working directory; set
# AFBOOTH_CONFIG to point somewhere else. Fetch the ONNX files it names with
# `scripts/fetch-models.sh` — they are not committed (see docs/models.md).

[models]
# Relative paths resolve against this file's directory. Git-ignored.
dir = "models"

# YuNet (MIT) — detection plus the five landmarks alignment needs (ADR-0007).
[models.detector]
file = "face_detection_yunet_2023mar.onnx"

# DINOv2 (Apache 2.0) — apparent resemblance, not identity resemblance
# (ADR-0007). Which ViT size follows the hardware decision, which is still open
# (ADR-0006): change `file` to dinov2-base.onnx or dinov2-large.onnx and re-fetch.
# The model id is derived from the file name, so the Corpus can tell the sizes
# apart; set `id` here only to override that.
[models.embedder]
file = "dinov2-small.onnx"

# How the wall's crop is framed around a detected face. The aligned 112x112 crop
# the model sees is fixed by the alignment template and is not configurable;
# this is the looser portrait a Visitor recognises. Square or portrait, and how
# tight, is an open question in docs/implementation-plan.md — settle it by eye.
[display]
margin = 0.35        # fraction of the detection box added on every side
aspect_ratio = 0.8   # width over height; 1.0 square, 0.8 a 4:5 portrait
width = 512          # rendered width in pixels
vertical_bias = 0.06 # lifts the frame, because hair puts the face low in the box

# Where the Corpus lives: `corpus.db` beside a tree of PNG files (ADR-0011).
# Relative to this file's directory, and git-ignored — it is photographs of
# people and never leaves the installation machine (ADR-0005).
[corpus]
dir = "corpus"

# The wall's Grid, fixed for the run. Breathing between afcore::MIN_CELLS and
# MAX_CELLS on the piece's own clock is Stage 3 (ADR-0004).
[grid]
cols = 5
rows = 4

# Which camera the Shutter opens. Omit `index` for the platform's first camera.
[camera]
# index = 0
