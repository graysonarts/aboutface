[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/graysonarts/aboutface"
# Edition 2024 needs 1.85, but afcore uses let-chains, stabilized in 1.88.
rust-version = "1.88"

[workspace.dependencies]
afcapture = { path = "crates/afcapture" }
# Error propagation in the binary: the booth prints a failure's whole source
# chain, because "camera failed" without "not found" is no use in a gallery.
anyhow = "1"
afcore = { path = "crates/afcore" }
# Raw-mode key events, so the placeholder Shutter is a keypress and not a
# keypress-plus-Enter. Example-only; nothing in the library depends on it.
crossterm = "0.29"
# Decoding replay fixtures (JPEG) and encoding captured frames (PNG). Captures
# are written losslessly: the original frame is retained at full quality so
# re-embedding stays possible (ADR-0006).
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
nokhwa = "0.10"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
thiserror = "2"
toml = "1"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
